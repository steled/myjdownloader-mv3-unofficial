name: 🚀 Release

# release-please keeps a release PR up to date from the conventional commits on
# main (version bump in manifest.json and updates.xml, CHANGELOG.md). Merging
# that PR creates the tag and GitHub release, then the build job below packs the
# extension and attaches the .crx.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: 📝 Release PR and tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: 📦 Build and attach .crx
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: 🔍 Check that tag, manifest and update manifest agree
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version=$(jq -r .version manifest.json)
          if [ "${TAG}" != "v${version}" ]; then
            echo "Tag ${TAG} does not match manifest version ${version}" >&2
            exit 1
          fi
          grep -q "version='${version}'" updates.xml || { echo "updates.xml version is not ${version}" >&2; exit 1; }
          grep -q "download/v${version}/" updates.xml || { echo "updates.xml codebase does not point to v${version}" >&2; exit 1; }

      - name: 🔑 Write signing key
        env:
          MYJD_PEM: ${{ secrets.MYJD_PEM }}
        run: |
          [ -n "${MYJD_PEM}" ] || { echo "Secret MYJD_PEM is not set" >&2; exit 1; }
          umask 077
          printf '%s\n' "${MYJD_PEM}" > "${RUNNER_TEMP}/myjd-mv3.pem"

      - name: 🪪 Check that the key matches the extension ID
        run: |
          pub=$(openssl rsa -in "${RUNNER_TEMP}/myjd-mv3.pem" -pubout -outform DER | openssl base64 -A)
          [ "${pub}" = "$(jq -r .key manifest.json)" ] || { echo "Signing key does not match manifest key" >&2; exit 1; }
          id=$(openssl rsa -in "${RUNNER_TEMP}/myjd-mv3.pem" -pubout -outform DER | openssl dgst -sha256 -binary | xxd -p -c 64 | cut -c1-32 | tr '0-9a-f' 'a-p')
          grep -q "appid='${id}'" updates.xml || { echo "updates.xml appid does not match ${id}" >&2; exit 1; }
          echo "Extension ID: ${id}"

      - name: 🧩 Pack extension
        run: |
          src="${RUNNER_TEMP}/myjdownloader-mv3"
          mkdir -p "${src}"
          git ls-files -z | xargs -0 -I{} cp --parents "{}" "${src}/"
          rm -rf "${src}/.github" "${src}/.husky" "${src}/updates.xml" "${src}/.gitignore" "${src}/.gitattributes" \
            "${src}/README.md" "${src}/CHANGELOG.md" "${src}/version.txt" "${src}/package.json" "${src}/package-lock.json" \
            "${src}/commitlint.config.js" "${src}/release-please-config.json" "${src}/.release-please-manifest.json"
          xvfb-run -a google-chrome-stable --no-sandbox \
            --pack-extension="${src}" \
            --pack-extension-key="${RUNNER_TEMP}/myjd-mv3.pem"
          test -s "${RUNNER_TEMP}/myjdownloader-mv3.crx"

      - name: 📎 Attach .crx to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "${TAG}" "${RUNNER_TEMP}/myjdownloader-mv3.crx" --clobber

      - name: 🧹 Remove signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/myjd-mv3.pem"
