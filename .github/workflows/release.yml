name: Release

# Usage: bump "version" in manifest.json and updates.xml, commit, then
#   git tag vX.Y.Z && git push origin vX.Y.Z
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that tag, manifest and update manifest agree
        run: |
          version=$(jq -r .version manifest.json)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${version}" >&2
            exit 1
          fi
          grep -q "version='${version}'" updates.xml || { echo "updates.xml version is not ${version}" >&2; exit 1; }
          grep -q "download/v${version}/" updates.xml || { echo "updates.xml codebase does not point to v${version}" >&2; exit 1; }

      - name: Write signing key
        env:
          MYJD_PEM: ${{ secrets.MYJD_PEM }}
        run: |
          [ -n "${MYJD_PEM}" ] || { echo "Secret MYJD_PEM is not set" >&2; exit 1; }
          umask 077
          printf '%s\n' "${MYJD_PEM}" > "${RUNNER_TEMP}/myjd-mv3.pem"

      - name: Check that the key matches the extension ID
        run: |
          pub=$(openssl rsa -in "${RUNNER_TEMP}/myjd-mv3.pem" -pubout -outform DER | openssl base64 -A)
          [ "${pub}" = "$(jq -r .key manifest.json)" ] || { echo "Signing key does not match manifest key" >&2; exit 1; }
          id=$(openssl rsa -in "${RUNNER_TEMP}/myjd-mv3.pem" -pubout -outform DER | openssl dgst -sha256 -binary | xxd -p -c 64 | cut -c1-32 | tr '0-9a-f' 'a-p')
          grep -q "appid='${id}'" updates.xml || { echo "updates.xml appid does not match ${id}" >&2; exit 1; }
          echo "Extension ID: ${id}"

      - name: Pack extension
        run: |
          src="${RUNNER_TEMP}/myjdownloader-mv3"
          mkdir -p "${src}"
          git ls-files -z | xargs -0 -I{} cp --parents "{}" "${src}/"
          rm -rf "${src}/.github" "${src}/updates.xml" "${src}/.gitignore" "${src}/README.md"
          xvfb-run -a google-chrome-stable --no-sandbox \
            --pack-extension="${src}" \
            --pack-extension-key="${RUNNER_TEMP}/myjd-mv3.pem"
          test -s "${RUNNER_TEMP}/myjdownloader-mv3.crx"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/myjdownloader-mv3.crx" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Remove signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/myjd-mv3.pem"
